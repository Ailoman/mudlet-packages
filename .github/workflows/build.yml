name: Rebuild dist packages + manifest

on:
  push:
    branches: [master]
    paths:
      - "packages/**"
      - "tools/gen_manifest.py"

permissions:
  contents: write

concurrency:
  group: rebuild-dist
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate manifest + dist packages
        run: python3 tools/gen_manifest.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "ailo-updater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/manifest.lua dist/ archive/
          if git diff --cached --quiet; then
            echo "nothing changed, skipping commit"
          else
            git commit -m "chore: rebuild dist packages + manifest [skip ci]"
            git push
          fi